<!-- Save as exception-portal-horizontal.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc">
  <title id="title">Exception Portal</title>
  <desc id="desc">Logo: stylized shield with exclamation + "Exception Portal" wordmark</desc>

  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#0ea5a3"></stop>
      <stop offset="1" stop-color="#0369a1"></stop>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b7285" flood-opacity="0.12"></feDropShadow>
    </filter>
  </defs>

  <!-- symbol: rounded shield with exclamation mark -->
  <g transform="translate(40,28)" filter="url(#soft)">
    <path d="M80 0 L160 36 L160 128 C160 172 120 212 80 248 C40 212 0 172 0 128 L0 36 Z" fill="url(#g1)" rx="12" ry="12"></path>
    <!-- inner highlight -->
    <path d="M80 12 L148 43 L148 128 C148 164 116 196 80 228 C44 196 12 164 12 128 L12 43 Z" fill="rgba(255,255,255,0.06)"></path>
    <!-- exclamation -->
    <rect x="70" y="58" width="20" height="68" rx="8" fill="#fff"></rect>
    <circle cx="80" cy="136" r="10" fill="#fff"></circle>
  </g>

  <!-- wordmark -->
  <g transform="translate(260,88)">
    <text x="0" y="0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="64" fill="#0f172a">Exception</text>
    <text x="0" y="74" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="600" font-size="40" fill="#475569">Portal</text>
  </g>
</svg>
