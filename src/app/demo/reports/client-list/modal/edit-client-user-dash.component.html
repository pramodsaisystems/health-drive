<nz-modal
  [nzMaskClosable]="false"
  [nzWidth]="'50vw'"
  [(nzVisible)]="isCUDVisible"
  [nzFooter]="modalFooter"
  [nzCentered]="true"
  nzTitle="User Mapping"
  (nzOnCancel)="handleCancel()"
>
  <ng-container *nzModalContent>
    <div>
      <h3>{{ selectedRow?.clientname }} -> {{ selectedReportName }}</h3>
    </div>
    <!-- <div nz-row class="menu-map-gb ps-4 pe-4 pt-2 pb-2" *ngIf="clientUserMapList?.length > 0; else elseBlock"> -->
    <!-- @for (data of clientUserMapList; track data) {
        <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="8" [nzLg]="8" [nzXl]="8">
          <label nz-checkbox [ngModel]="data?.ischecked" (ngModelChange)="onClickMenu(data)">{{ data?.username }}</label>
        </div>
      } -->
    <div>
      <nz-table nzNoResult="No Data Found." #basicTable [nzOuterBordered]="true" [nzShowPagination]="false" [nzData]="clientUserMapList">
        <thead>
          <tr>
            <th>Role</th>
            <th>Name</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          @for (data of clientUserMapList; track data) {
            <tr>
              <td>{{ data.rolename }}</td>
              <td>{{ data.username }}</td>
              <td>
                <label nz-checkbox [ngModel]="data?.ischecked" (ngModelChange)="onClickMenu(data)"></label>
              </td>
            </tr>
          }
        </tbody>
      </nz-table>
    </div>
    <!-- <ng-template #elseBlock><div class="d-flex justify-content-center">No Data Found.</div></ng-template> -->
  </ng-container>
  <ng-template #modalFooter>
    <button nz-button nzType="default" (click)="handleCancel()">Cancel</button>
    <button nz-button nzType="primary" (click)="handleOk()">Save</button>
  </ng-template>
</nz-modal>
