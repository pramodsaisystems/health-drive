<div class="row report-cont">
  <div class="col-sm-12">
    <div class="row pb-4">
      <div class="col-10">
        <span class="card-header-title">Clients</span>
        <img
          style="cursor: pointer"
          src="assets/images/info-circle.svg"
          alt="user information"
          width="20"
          height="20"
          class="ms-1 mb-2"
          (click)="onInfoClick()"
        />
      </div>
      <div class="col-2 d-flex justify-content-end">
        <button nz-button nzType="primary" (click)="onAddNewClient()">
          <img width="16" height="15" src="assets/images/user/add_client.svg" class="me-1 mb-1" />
          Add Client
        </button>
      </div>
    </div>
    <div class="card">
      <div class="card-block">
        <form nz-form [formGroup]="validateForm" [nzLayout]="'vertical'" class="login-form">
          <ng-container>
            <div nz-row [nzGutter]="8">
              <div nz-col [nzXs]="12" [nzSm]="12" [nzMd]="8" [nzLg]="4" [nzXl]="4">
                <nz-form-item>
                  <nz-form-control [nzSpan]="24" nzErrorTip="Please input your search text!">
                    <nz-input-group>
                      <input type="text" nz-input formControlName="search" placeholder="Search" />
                    </nz-input-group>
                  </nz-form-control>
                </nz-form-item>
              </div>

              <div nz-col [nzXs]="12" [nzSm]="12" [nzMd]="8" [nzLg]="4" [nzXl]="4">
                <nz-form-item>
                  <nz-form-control [nzSpan]="24" nzErrorTip="Please select status!">
                    <nz-select nzShowSearch formControlName="status" nzPlaceHolder="Select Status">
                      <nz-option nzValue="1" nzLabel="Active"></nz-option>
                      <nz-option nzValue="0" nzLabel="In-Active"></nz-option>
                    </nz-select>
                  </nz-form-control>
                </nz-form-item>
              </div>
              <div nz-col [nzSpan]="6">
                <nz-form-item>
                  <nz-form-control>
                    <button nz-button class="me-2" nzType="primary" (click)="submitForm()">
                      <span nz-tooltip nzTooltipTitle="search" nz-icon nzType="search"></span>
                    </button>
                    <button nz-button nzType="default" (click)="handleReset()">
                      <span nz-tooltip nzTooltipTitle="reset" nz-icon nzType="close-circle" nzTheme="outline"></span>
                    </button>
                  </nz-form-control>
                </nz-form-item>
              </div>
            </div>
            <!-- <button nz-button class="login-form-button login-form-margin" [nzType]="'primary'">Log in</button> -->
          </ng-container>
        </form>
        <nz-table [nzPageSize]="20" nzNoResult="No Data Found." [nzLoading]="loading" #basicTable [nzData]="clientList">
          <thead>
            <tr>
              <th [nzSortFn]="sortClientNameFn">Client Name</th>
              <th [nzSortFn]="sortClientShortNameFn">Client Short Name</th>
              <!-- <th [nzSortFn]="sortClientIdFn">Client Id</th> -->
              <th [nzSortFn]="sortActiveFn">Active</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            @for (data of basicTable.data; track data) {
              <tr>
                <td>{{ data.clientname }}</td>
                <td>{{ data.clientshortname }}</td>

                <!-- <td>{{ data.clientid }}</td> -->

                <td>
                  <div (click)="onDeactivate(data)"><nz-switch [(ngModel)]="data.isactive" [nzControl]="true"></nz-switch></div>
                </td>
                <td>
                  <a (click)="showModal(data, 'Edit')" nz-tooltip nzTooltipTitle="Edit Client">
                    <img src="assets/images/pencil.svg" height="18" width="18" class="me-2" alt="Edit client" />
                  </a>
                  <a (click)="editClientMenuMapping(data)" nz-tooltip nzTooltipTitle="Edit client report mapping">
                    <img src="assets/images/ui-checks.svg" class="me-2" height="18" width="18" alt="Delete user" />
                  </a>
                  <a
                    nz-tooltip
                    nzTooltipTitle="Delete client"
                    (click)="onDeleteClient(data.clientid)"
                    [ngClass]="selectedClient === data.clientid ? 'disabled' : ''"
                  >
                    <img src="assets/images/delete.svg" height="18" width="18" alt="Delete client" />
                  </a>
                </td>
              </tr>
            }
          </tbody>
        </nz-table>
      </div>
    </div>

    <!-- <app-card cardTitle="Clients" buttonText="Add Client" (onBtnClickEvt)="onAddNewClient()"> -->

    <view-edit-client-modal
      *ngIf="isVisible"
      [isVisible]="isVisible"
      [type]="type"
      [selectedRow]="selectedRow"
      (closeModalEvent)="onCloseModalEvent($event)"
    ></view-edit-client-modal>
    <edit-new-client-menu-modal
      *ngIf="isERMVisible"
      [isVisible]="isERMVisible"
      [selectedRow]="selectedRow"
      [clientMenuMapList]="clientMenuMapList"
      (closeModalEvent)="onERMCloseModalEvent($event)"
    ></edit-new-client-menu-modal>
    <information-modal
      *ngIf="isIMVisible"
      [isVisible]="isIMVisible"
      [type]="'Clients'"
      (closeModalEvent)="onIMCloseModalEvent($event)"
    ></information-modal>
    <!-- </app-card> -->
  </div>
</div>
