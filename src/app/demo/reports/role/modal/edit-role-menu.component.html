<nz-modal
  [nzMaskClosable]="false"
  [nzWidth]="'60vw'"
  [(nzVisible)]="isVisible"
  [nzFooter]="modalFooter"
  nzTitle="Role Menu Mapping"
  (nzOnCancel)="handleCancel()"
>
  <ng-container *nzModalContent>
    <div>
      <h3>{{ selectedRow?.clientname }} -> {{ selectedRow?.rolename }}</h3>
    </div>
    <div>
      @for (data of roleMenuMapList; track data) {
        <div class="pt-2 pb-2">
          <label nz-checkbox [ngModel]="data?.isactive" (ngModelChange)="onClickMenu(data)">{{ data?.menuname }}</label>
        </div>
        <div class="row ps-2 ms-0 pt-2 pb-2 menu-map-gb">
          @for (item of data.subMenuMasterListDTO; track item) {
            <div class="col-sm-8 col-xs-8 col-md-4 col-lg-4 col-xl-4">
              <label nz-checkbox [ngModel]="item?.isactive" (ngModelChange)="onClickSubmenu(data, item)">{{ item?.submenuname }}</label>
            </div>
          }
        </div>
      }
    </div>
  </ng-container>
  <ng-template #modalFooter>
    <button nz-button nzType="default" (click)="handleCancel()">Cancel</button>
    <button nz-button nzType="primary" (click)="handleOk()">Save</button>
  </ng-template>
</nz-modal>
