<nz-modal
  [nzMaskClosable]="false"
  [(nzVisible)]="isVisible"
  [nzFooter]="modalFooter"
  nzTitle="{{ type }} Role"
  (nzOnCancel)="handleCancel()"
>
  <form nz-form [formGroup]="validateForm" [nzLayout]="'vertical'" class="login-form" (ngSubmit)="submitForm()">
    <ng-container *nzModalContent>
      <div nz-row [nzGutter]="8">
        <div nz-col [nzSpan]="12">
          <!-- <nz-form-item>
            <nz-form-label [nzSpan]="24" nzRequired nzFor="clientname">Client Name</nz-form-label>
            <nz-form-control [nzSpan]="24" nzErrorTip="Please input your client name!">
              <nz-input-group>
                <input type="text" nz-input formControlName="clientname" placeholder="Enter Client Name" />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item> -->
          <nz-form-item>
            <nz-form-label [nzSpan]="24" nzFor="clientid" nzRequired>Client Name</nz-form-label>
            <nz-form-control [nzSpan]="24" nzErrorTip="Client name is required!">
              <nz-select
                nzShowSearch
                formControlName="clientid"
                nzPlaceHolder="Select Client"
                (ngModelChange)="updateConfirmValidator($event)"
              >
                @for (data of clientsList; track data) {
                  <nz-option nzValue="{{ data.id }}" nzLabel="{{ data.name }}"></nz-option>
                }
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col [nzSpan]="12">
          <nz-form-item>
            <nz-form-label [nzSpan]="24" nzRequired nzFor="rolename">Role</nz-form-label>
            <nz-form-control [nzSpan]="24" nzErrorTip="Role is required!">
              <nz-input-group>
                <input type="text" nz-input formControlName="rolename" placeholder="Enter Role Name" />
              </nz-input-group>
            </nz-form-control>
          </nz-form-item>
          <!-- <nz-form-item>
            <nz-form-label [nzSpan]="24" nzFor="userroleid" nzRequired>Role</nz-form-label>
            <nz-form-control [nzSpan]="24" nzErrorTip="Please select your role!">
              <nz-select formControlName="userroleid" placeholder="Select Role">
                @for (data of userRolesData; track data) {
                  <nz-option nzValue="{{ data.id }}" nzLabel="{{ data.name }}"></nz-option>
                }
              </nz-select>
            </nz-form-control>
          </nz-form-item> -->
        </div>

        <!-- <div nz-col [nzSpan]="12">
          <nz-form-item>
            <nz-form-control [nzSpan]="24" nzErrorTip="Please select show in DDL!">
              <label nz-checkbox formControlName="isshowntoddl">
                <span>Is show in DDL</span>
              </label>
            </nz-form-control>
          </nz-form-item>
        </div> -->
      </div>
      <!-- <button nz-button class="login-form-button login-form-margin" [nzType]="'primary'">Log in</button> -->
    </ng-container>

    <ng-template #modalFooter>
      <nz-form-item>
        <nz-form-control>
          <button nz-button nzType="default" (click)="handleCancel()">Cancel</button>
          <button nz-button nzType="primary" (click)="submitForm()">Save</button>
        </nz-form-control>
      </nz-form-item>
    </ng-template>
  </form>
</nz-modal>
